<div class="graph-wrap virtual-graph" tabindex="0" data-viewport-x="{{ graph.viewport_x }}" data-viewport-y="{{ graph.viewport_y }}" data-canvas-width="{{ graph.canvas_width }}" data-zoom="1">
    <button class="follow-toggle" type="button" aria-pressed="false" title="Keep the graph pinned to the top-right edge">Follow</button>
    <svg class="graph" role="img" aria-label="CoCo node graph" viewBox="{{ graph.viewport_x }} {{ graph.viewport_y }} {{ graph.viewport_width }} {{ graph.viewport_height }}" width="100%" height="100%">
        {% include "graph_markers.svg" %}
        <rect class="graph-bg" x="0" y="0" width="{{ graph.canvas_width }}" height="{{ graph.canvas_height }}"></rect>
        <g class="graph-edges">
            {% for edge in graph.edges %}
            <path id="{{ edge.id }}" data-render-key="{{ edge.key }}" class="{{ edge.class }}" marker-end="{{ edge.marker }}" d="{{ edge.path }}" data-source-x="{{ edge.source_x }}" data-source-y="{{ edge.source_y }}" data-control-1-x="{{ edge.control_1_x }}" data-control-1-y="{{ edge.control_1_y }}" data-control-2-x="{{ edge.control_2_x }}" data-control-2-y="{{ edge.control_2_y }}" data-target-x="{{ edge.target_x }}" data-target-y="{{ edge.target_y }}" data-edge-kind="{{ edge.kind }}" data-source-id="{{ edge.source_id }}" data-target-id="{{ edge.target_id }}"></path>
            {% if graph.render_edge_hit_targets %}
            <path id="{{ edge.hit_target_id }}" class="edge-hit-target" d="{{ edge.path }}" data-anchor-range="true" data-edge-kind="{{ edge.kind }}" data-source-id="{{ edge.source_id }}" data-target-id="{{ edge.target_id }}" tabindex="0" role="button" aria-pressed="false" aria-label="{{ edge.hit_target_label }}"></path>
            {% endif %}
            {% endfor %}
        </g>
        <g class="graph-nodes">
            {% for node in graph.nodes %}
            <a id="{{ node.id }}" data-render-key="{{ node.key }}" class="node-link" href="#{{ node.target }}" data-node-target="{{ node.target }}" data-node-id="{{ node.node_id }}" data-base-node-x="{{ node.x }}" data-node-x="{{ node.x }}" data-node-y="{{ node.y }}">
                <g class="{{ node.class }}" transform="translate({{ node.x }} {{ node.y }})">
                    <title>{{ node.title }}</title>
                    <circle class="core" r="18"></circle>
                    <text class="node-label" y="31">{{ node.label }}</text>
                    <text class="node-kind" y="44">{{ node.kind }}</text>
                </g>
            </a>
            {% endfor %}
        </g>
        <g class="graph-anchor-range" aria-live="polite"></g>
    </svg>
    <div class="graph-status" hidden></div>
</div>
